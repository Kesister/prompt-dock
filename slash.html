<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: prompt-dock-image:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'">
  <link rel="stylesheet" href="slash.css"><title>快捷调用</title>
</head>
<body>
  <header>
    <span class="mark">P</span><strong>快捷调用</strong><span id="mode">Prompt Dock</span>
    <button id="preview-toggle" class="icon-button" title="收起预览" aria-label="收起预览" aria-pressed="true" aria-controls="preview" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M12 4v16M6.5 8h2M6.5 12h2M15.5 8h2M15.5 12h2"/></svg>
    </button>
    <button id="close" class="icon-button" aria-label="关闭" title="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </header>
  <div id="workspace">
    <section id="candidates" aria-label="搜索与选择">
      <input id="search" placeholder="搜索 Prompt、简称或标签" maxlength="100" autocomplete="off" hidden>
      <div id="query"></div><div id="results" role="listbox" aria-label="Prompt 候选"></div>
    </section>
    <aside id="preview" aria-label="Prompt 预览" hidden>
      <div class="preview-heading"><span>内容预览</span><span id="preview-version"></span></div>
      <div id="preview-scroll" tabindex="0" aria-label="预览内容，可滚动查看" role="region">
        <div id="preview-placeholder">选中一条 Prompt 查看内容</div>
        <article id="preview-content" hidden>
          <h2 id="preview-title"></h2>
          <div id="preview-tags"></div>
          <section id="preview-note" hidden><h3>使用说明</h3><p id="preview-note-text"></p></section>
          <section id="preview-images-section" hidden><h3 id="preview-images-label">参考图片</h3><div id="preview-images"></div></section>
          <section class="preview-body-section"><h3>Prompt 正文</h3><div id="preview-body"></div></section>
        </article>
      </div>
    </aside>
  </div>
  <footer><span id="hint">↑↓ 选择 · → 版本 · Tab 插入 · Esc 取消</span><button id="accessibility-settings" hidden>打开辅助功能设置</button></footer>
  <script src="slash-renderer.js"></script>
</body>
</html>
