name: Publish Windows v0.11.4 dialog drag fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-dialog-v0114.yml']
permissions:
  contents: write
concurrency:
  group: release-v0.11.4
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.11.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate version and prevent overwriting a release
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($version -ne '0.11.4') { throw 'This one-time release is only for Windows v0.11.4.' }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists. Refusing to overwrite it.' }
          $global:LASTEXITCODE = 0
      - name: Run regression tests
        run: npm test
      - name: Build Windows installer and update metadata
        run: npm run dist:installer
      - name: Smoke test packaged app
        shell: pwsh
        run: node scripts/smoke-test.js "dist/win-unpacked/Prompt Dock.exe"
      - name: Verify installer and prepare release notes
        run: npm run release:prepare
      - name: Tag verified source and upload draft release
        shell: pwsh
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/git/refs" --method POST -f "ref=refs/tags/$env:RELEASE_TAG" -f "sha=$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create a new source tag. Nothing was overwritten.' }
          gh release create $env:RELEASE_TAG "dist/Prompt-Dock-0.11.4-Setup.exe" "dist/Prompt-Dock-0.11.4-Setup.exe.blockmap" dist/latest.yml dist/SHA256SUMS.txt --verify-tag --draft --target $env:GITHUB_SHA --title "Prompt Dock v0.11.4 · Windows" --notes-file dist/RELEASE-NOTES.md --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed. No release has been published.' }
      - name: Verify every uploaded asset and publish the release
        shell: pwsh
        run: |
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=30" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read release metadata.' }
          $drafts = @($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG })
          if ($drafts.Count -ne 1 -or !$drafts[0].draft -or $drafts[0].prerelease) { throw 'Expected exactly one stable draft.' }
          $draft = $drafts[0]
          if ($draft.target_commitish -ne $env:GITHUB_SHA) { throw 'Draft source does not match this build.' }
          if ($draft.body.Trim() -ne (Get-Content dist/RELEASE-NOTES.md -Raw).Trim()) { throw 'Public notes do not match the prepared notes.' }
          $names = @('Prompt-Dock-0.11.4-Setup.exe', 'Prompt-Dock-0.11.4-Setup.exe.blockmap', 'latest.yml', 'SHA256SUMS.txt')
          if ($draft.assets.Count -ne $names.Count) { throw 'Unexpected release asset count.' }
          foreach ($name in $names) {
            $assets = @($draft.assets | Where-Object name -eq $name)
            $file = Get-Item (Join-Path dist $name)
            $digest = 'sha256:' + (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($assets.Count -ne 1 -or $assets[0].state -ne 'uploaded' -or $assets[0].size -ne $file.Length -or $assets[0].digest -ne $digest) { throw "Release asset verification failed: $name" }
          }
          gh api "repos/$env:GITHUB_REPOSITORY/releases/$($draft.id)" --method PATCH -F draft=false -F prerelease=false -f make_latest=true
          if ($LASTEXITCODE -ne 0) { throw 'Publishing failed. The verified draft is retained.' }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
          if ($latest.id -ne $draft.id -or $latest.draft -or $latest.tag_name -ne $env:RELEASE_TAG) { throw 'Latest release verification failed.' }
          Write-Output "Published and verified $($latest.html_url)"
