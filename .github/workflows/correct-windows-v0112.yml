name: Finalize Windows v0.11.2 correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/correct-windows-v0112.yml']
permissions:
  contents: write
jobs:
  publish:
    if: >-
      github.repository == 'Kesister/prompt-dock' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'fix: finish Windows v0.11.2 publication [finish-correct-0112-20261025]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the completed installer draft and publish
        shell: python
        run: |
          import os, json, urllib.request, urllib.error
          base = 'https://api.github.com/repos/Kesister/prompt-dock'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'}
          def api(path, method='GET', body=None):
              request = urllib.request.Request(base + path, data=None if body is None else json.dumps(body).encode(), headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          release = api('/releases/422956384')
          assert release['tag_name'] == 'v0.11.2' and release['draft'] is True and release['prerelease'] is False
          assert release['target_commitish'] == 'e19ef5965591cdb006b7e252e91fff83d604d86a'
          expected = {
              'latest.yml': 'sha256:0ed01f8ad35c588182a9d87b0ac3aa6ade600229e5b69114068a63bc9b2baebb',
              'Prompt-Dock-0.11.2-Setup.exe': 'sha256:63e69cc854aef3e6980c00827912d9c5a3b9468d25588c3fd227e78107f9afaf',
              'Prompt-Dock-0.11.2-Setup.exe.blockmap': 'sha256:ed2711f2c08fb4da3cfd7c61571edbc9136aacc7fe48843c96cca6331dc1f7a3',
              'SHA256SUMS.txt': 'sha256:87bfecf62ed088bf28950563a6bf62955398fd510f7b49bea9b62b5886981d37'
          }
          assert len(release['assets']) == 4
          for asset in release['assets']:
              assert asset['state'] == 'uploaded' and asset['digest'] == expected[asset['name']]
          assert all(text not in release['body'] for text in ['交接', 'CI', '测试', '0.11.3'])
          assert len(release['body']) < 1500
          try:
              api('/git/ref/tags/v0.11.3')
          except urllib.error.HTTPError as error:
              assert error.code == 404
          else:
              raise RuntimeError('The unwanted Windows tag still exists.')
          result = api('/releases/422956384', 'PATCH', {'draft': False, 'prerelease': False, 'make_latest': 'true'})
          assert result['draft'] is False and result['tag_name'] == 'v0.11.2'
          assert api('/releases/latest')['id'] == 422956384
          print('Published verified Windows v0.11.2: ' + result['html_url'])
