name: Correct Windows v0.11.2 release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/correct-windows-v0112.yml']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  correct:
    if: >-
      github.repository == 'Kesister/prompt-dock' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'fix: restore Windows v0.11.2 release [correct-0112-20261025]')
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate correction scope
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'Kesister/prompt-dock') { throw 'Unexpected repository.' }
          if ((Get-Content package.json | ConvertFrom-Json).version -ne '0.11.2') { throw 'Unexpected version.' }
          $expected = @(
            @{ id = 422794521; tag = 'v0.11.2'; draft = $false; target = '8f520809be4816117b74b25dcb0ecea471c182cf' },
            @{ id = 422806444; tag = 'v0.11.3'; draft = $false; target = '6753d80b2dce60342268dad15f7fab46d739b3f6' },
            @{ id = 422785648; tag = ''; draft = $true; target = 'main' }
          )
          New-Item -ItemType Directory release-backup -Force | Out-Null
          foreach ($item in $expected) {
            $raw = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($item.id)"
            if ($LASTEXITCODE -ne 0) { throw 'Expected release is unavailable; no releases were changed.' }
            $release = $raw | ConvertFrom-Json
            if ($release.tag_name -ne $item.tag -or $release.draft -ne $item.draft -or $release.target_commitish -ne $item.target -or $release.name -notlike '*Windows') { throw 'Release identity changed; no releases were changed.' }
            $raw | Set-Content "release-backup/release-$($item.id).json" -Encoding utf8
          }
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Build Windows installer
        run: npm run dist:installer
      - name: Verify packaged application
        shell: pwsh
        run: node scripts/smoke-test.js "dist/win-unpacked/Prompt Dock.exe"
      - name: Prepare installer checksums and public release notes
        run: npm run release:prepare
      - name: Back up the two previous Windows releases
        shell: pwsh
        run: |
          foreach ($tag in @('v0.11.2', 'v0.11.3')) {
            gh release download $tag --repo $env:GITHUB_REPOSITORY --dir "release-backup/$tag"
            if ($LASTEXITCODE -ne 0) { throw 'Could not back up old release; no releases were changed.' }
            $id = if ($tag -eq 'v0.11.2') { 422794521 } else { 422806444 }
            $release = Get-Content "release-backup/release-$id.json" -Raw | ConvertFrom-Json
            foreach ($asset in $release.assets) {
              $actual = (Get-FileHash -LiteralPath "release-backup/$tag/$($asset.name)" -Algorithm SHA256).Hash.ToLowerInvariant()
              if ("sha256:$actual" -ne $asset.digest) { throw 'Release backup checksum mismatch; no releases were changed.' }
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-releases-before-version-correction
          path: release-backup/
          retention-days: 7
      - name: Replace only the confirmed Windows releases
        shell: pwsh
        run: |
          foreach ($tag in @('v0.11.3', 'v0.11.2')) {
            gh release delete $tag --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Could not remove $tag." }
          }
          gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/422785648"
          if ($LASTEXITCODE -ne 0) { throw 'Could not remove the old unpublished Windows upload draft.' }
          gh release create v0.11.2 dist/Prompt-Dock-0.11.2-Setup.exe dist/Prompt-Dock-0.11.2-Setup.exe.blockmap dist/latest.yml dist/SHA256SUMS.txt --draft --target $env:GITHUB_SHA --title 'Prompt Dock v0.11.2 · Windows' --notes-file dist/RELEASE-NOTES.md --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Replacement upload failed; the release remains unpublished.' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v0.11.2" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.assets.Count -ne 4) { throw 'Replacement assets are incomplete.' }
          foreach ($asset in $release.assets) {
            $actual = (Get-FileHash -LiteralPath "dist/$($asset.name)" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.state -ne 'uploaded' -or "sha256:$actual" -ne $asset.digest) { throw 'Replacement checksum mismatch.' }
          }
          gh release edit v0.11.2 --draft=false --prerelease=false --latest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified replacement.' }
